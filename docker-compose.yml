services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  api:
    build: .
    image: self-healing-workflow-engine-backend:local
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    image: self-healing-workflow-engine-backend:local
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  scheduler:
    build: .
    image: self-healing-workflow-engine-backend:local
    command: ["python", "-m", "backend.app", "scheduler"]
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
  worker:
    build: .
    image: self-healing-workflow-engine-backend:local
    command: ["python", "-m", "backend.app", "worker"]
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: api:8000
    ports: ["5173:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health/ui').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
